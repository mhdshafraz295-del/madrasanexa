<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MadrasaNexa — Islamic Educational Institution Management Platform</title>
    <script>
      (function() {
        try {
          var path = window.location.pathname;
          if (path.startsWith('/super-admin') && path !== '/super-admin/website-content/preview') {
            var superAdminSaved = localStorage.getItem('madrasanexa_super_admin_theme');
            if (superAdminSaved === 'dark') {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          } else if (path.startsWith('/madrasa-admin')) {
            var adminSaved = localStorage.getItem('madrasanexa_admin_theme');
            if (adminSaved === 'dark') {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          } else {
            // All public portals, system website, login, register, and preview routes are strictly Light Mode
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B0D11] text-[#0F172A] dark:text-[#F9FAFB] antialiased selection:bg-[#84CC16]/20 selection:text-[#F9FAFB]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
